[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "mr-distortion-phantom"
version = "0.1.0"
description = "Independent CT-referenced MR distortion phantom research workflow"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pydicom>=2.4", "matplotlib>=3.7", "Pillow>=9"]
[project.scripts]
mr-distortion-phantom = "mr_distortion_phantom.__main__:main"
[tool.setuptools.package-data]
mr_distortion_phantom = ["data/*.csv", "data/*.json"]
[tool.setuptools.packages.find]
include = ["mr_distortion_phantom*"]
